<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalimah">
<meta name="theme-color" content="#0B0B0C">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Kalimah Word Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Single-column phone layout, black canvas, gold for the one thing that matters, pastels only to tell decks and ratings apart */
  --bg:#0B0B0C; --surface:#131315; --raise:#1B1B1E; --line:#26262A;
  --text:#ECE7DC; --muted:#8E897F; --faint:#5C5952;
  --gold:#C8A862; --gold-dim:rgba(200,168,98,.14);
  --sand:#E3D2A6; --sky:#A9C5D6; --lav:#BCB4D9; --sage:#AAC4A5; --rose:#E1B4AD; --mint:#B2D3C8;
  --f-ar:"Amiri","Geeza Pro","Noto Naskh Arabic",serif;
  --f-display:"Cormorant Garamond",Georgia,serif;
  --f-body:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:1.5px solid var(--gold);outline-offset:3px;border-radius:10px}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 104px)}
.ar{font-family:var(--f-ar);direction:rtl;line-height:1.9}
h1,h2{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0;letter-spacing:.005em}
h1{font-size:2.1rem;line-height:1.15}
h2{font-size:1.35rem}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:24px}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}

/* brand */
.brand{display:flex;align-items:center;justify-content:space-between}
.brand .mark{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.25rem;color:var(--gold);letter-spacing:.04em}
.brand .ar{color:var(--gold);font-size:1.5rem;opacity:.85}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px}
.stat b{display:block;font-family:var(--f-display);font-weight:500;font-size:2rem;line-height:1;color:var(--text);font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.stat.gold b{color:var(--gold)}

/* session card */
.session{border:1px solid rgba(200,168,98,.35);background:linear-gradient(180deg,rgba(200,168,98,.07),rgba(200,168,98,0) 70%);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.session p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;padding:0 20px;font-weight:600;letter-spacing:.01em;transition:transform .15s ease,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--gold);color:#16130B}
.btn.ghost{border:1px solid var(--line);color:var(--text)}
.btn.full{width:100%}

/* decks */
.decks{display:flex;flex-direction:column;gap:8px}
.deck{display:grid;grid-template-columns:10px 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;transition:border-color .2s}
.deck.on{border-color:rgba(200,168,98,.55)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.deck .name{font-weight:600;font-size:.98rem}
.deck .sub{font-size:.8rem;color:var(--muted)}
.deck .side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.deck .side .ar{font-size:1.15rem;line-height:1.3;color:var(--c)}
.deck .count{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:2/4;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:3px}
.now{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}

/* study */
.top{display:flex;align-items:center;gap:14px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.prog{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.top .n{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.flash{position:relative;width:100%;min-height:390px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 22px 26px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pill{align-self:flex-start;font-size:.72rem;letter-spacing:.06em;padding:4px 10px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.word{font-size:4.2rem;line-height:1.6;margin-top:18px;color:var(--text)}
.speak{position:absolute;top:16px;right:16px}
.hint{margin-top:auto;font-size:.85rem;color:var(--faint)}
.tr{font-style:italic;color:var(--muted);font-size:1rem}
.en{font-family:var(--f-display);font-size:1.75rem;line-height:1.2;color:var(--gold);text-wrap:balance}
.type{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.ex{margin-top:14px;padding-top:16px;border-top:1px solid var(--line);width:100%;display:flex;flex-direction:column;gap:4px}
.ex .ar{font-size:1.45rem;line-height:2}
.ex p{margin:0}
.ex .t{font-size:.9rem;color:var(--muted)}
.ref{font-size:.75rem;color:var(--gold);letter-spacing:.06em}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{border-radius:14px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;background:color-mix(in srgb,var(--c) 11%,var(--bg));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);color:var(--c)}
.rate b{font-weight:600;font-size:.92rem}
.rate small{font-size:.72rem;opacity:.75;font-variant-numeric:tabular-nums}

/* quiz */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;height:38px;border-radius:9px;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--raise);color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:.84rem;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.chip.on{border-color:var(--c,var(--gold));color:var(--text)}
.chip .dot{width:7px;height:7px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px 20px;text-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.q .ar{font-size:3.4rem;line-height:1.7}
.q .enq{font-family:var(--f-display);font-size:1.9rem;color:var(--gold);line-height:1.2}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:border-color .2s,background .2s}
.opt.aropt{justify-content:center;font-size:1.7rem}
.opt.ok{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 12%,var(--bg));color:var(--sage)}
.opt.no{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 10%,var(--bg));color:var(--rose)}
.score{font-family:var(--f-display);font-size:4rem;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}

/* words */
.search{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 16px;font:inherit}
.search::placeholder{color:var(--faint)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{width:100%;text-align:left;display:grid;grid-template-columns:8px 1fr auto;gap:14px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.row .st{width:8px;height:8px;border-radius:50%;background:var(--s)}
.row .m{font-size:.95rem}
.row .m small{display:block;color:var(--muted);font-style:italic;font-size:.82rem}
.row .ar{font-size:1.6rem;line-height:1.5}
.detail{grid-column:1/4;padding:4px 0 6px 22px;display:flex;flex-direction:column;gap:4px}
.detail .ar{font-size:1.3rem;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:7px;height:7px;border-radius:50%;background:var(--s)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(11,11,12,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 12px calc(env(safe-area-inset-bottom) + 8px)}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--faint);padding:6px 0}
.tabs button.on{color:var(--gold)}
.tabs svg{width:22px;height:22px}
.foot{font-size:.78rem;color:var(--faint);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:40px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <button data-tab="quiz" aria-label="Quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.3 2.3 4.7-5"/></svg>Quiz</button>
  <button data-tab="words" aria-label="Words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Words</button>
</nav></div>

/* ---------- State ---------- */
const KEY='kalimah.v1', NEW_PER_DAY=10, DAY=864e5;
function fresh(){return {cards:{},focus:'fatiha',newDay:'',newCount:0,days:[]}}
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cards)return Object.assign(fresh(),s)}catch(e){}return fresh()})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const dk=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const sod=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};

/* Spaced repetition: 0 again, 1 hard, 2 good, 3 easy */
function sched(c,r,now){
  c=Object.assign({ivl:0,ease:2.5,reps:0},c||{});
  if(r===0){c.reps=0;c.ivl=0;c.ease=Math.max(1.3,c.ease-.2)}
  else if(r===1){c.ivl=Math.max(1,Math.round(c.ivl*1.2));c.ease=Math.max(1.3,c.ease-.15);c.reps++}
  else if(r===2){c.ivl=c.reps===0?2:c.reps===1?4:Math.max(c.ivl+1,Math.round(c.ivl*c.ease));c.reps++}
  else {c.ivl=c.reps===0?4:Math.max(c.ivl+2,Math.round(Math.max(c.ivl,1)*c.ease*1.3));c.ease+=.15;c.reps++}
  const start=new Date(now);start.setHours(0,0,0,0);
  c.due=c.ivl===0?now:start.getTime()+c.ivl*DAY;
  return c;
}
const fmtIvl=n=>n===0?'now':n<30?n+'d':n<365?Math.round(n/30)+'mo':(n/365).toFixed(1)+'y';
function status(id){const c=S.cards[id];if(!c)return 'new';if(c.ivl>=21)return 'mastered';if(c.ivl>=7)return 'known';return 'learning'}
const STC={new:'var(--faint)',learning:'var(--sand)',known:'var(--sage)',mastered:'var(--gold)'};
const learned=id=>{const c=S.cards[id];return !!c&&c.ivl>=1};
function dueIds(){const n=Date.now();return WORDS.filter(w=>S.cards[w.id]&&S.cards[w.id].due<=n).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due).map(w=>w.id)}
function newLeft(){return Math.max(0,NEW_PER_DAY-(S.newDay===dk(Date.now())?S.newCount:0))}
function newIds(){
  const order=[S.focus,...DECKS.map(d=>d.id).filter(x=>x!==S.focus)];
  const out=[];for(const d of order)for(const w of WORDS)if(w.d===d&&!S.cards[w.id])out.push(w.id);
  return out.slice(0,newLeft());
}
function streak(){const set=new Set(S.days);let d=sod();if(!set.has(dk(d)))d-=DAY;let n=0;while(set.has(dk(d))){n++;d-=DAY}return n}

/* ---------- Speech (device voice, not recitation) ---------- */
const canSpeak='speechSynthesis' in window;
function speak(t){try{const u=new SpeechSynthesisUtterance(t.replace(/ـ/g,''));u.lang='ar-SA';u.rate=.75;const v=speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const spk=t=>canSpeak?`<button class="iconbtn speak" data-act="speak" data-t="${t}" aria-label="Hear pronunciation"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg></button>`:'';

function vToday(){
  const due=dueIds().length, nw=newIds().length, total=WORDS.length, lc=WORDS.filter(w=>learned(w.id)).length;
  const decks=DECKS.map(d=>{const ws=WORDS.filter(w=>w.d===d.id);const l=ws.filter(w=>learned(w.id)).length;const on=S.focus===d.id;

      <span><span class="name">${d.name}</span><br><span class="sub">${on?'<span class="now">Learning now</span>':d.note}</span></span>

      <span class="bar"><i style="width:${ws.length?l/ws.length*100:0}%"></i></span></button>`}).join('');
  const parts=[];if(due)parts.push(`${due} review${due>1?'s':''}`);if(nw)parts.push(`${nw} new word${nw>1?'s':''}`);
  return `<div class="stack fade">
   <div class="brand"><span class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3l2.6 2.6H18.4V9.4L21 12l-2.6 2.6v3.8h-3.8L12 21l-2.6-2.6H5.6v-3.8L3 12l2.6-2.6V5.6h3.8z"/></svg>Kalimah</span><span class="ar">كَلِمَة</span></div>

   <div class="session">${parts.length?`<div><div class="eyebrow">Today’s session</div><p style="margin-top:4px;font-size:1.05rem">${parts.join(' · ')}</p></div><button class="btn gold full" data-act="start">Begin session</button>`
     :`<div><div class="eyebrow">Today’s session</div><p style="margin-top:4px;font-size:1.05rem">All done for today. Come back tomorrow, in shāʾ Allāh.</p></div><button class="btn ghost full" data-act="tab" data-tab="quiz">Practise with a quiz</button>`}</div>
   <div class="stack" style="gap:12px"><div class="eyebrow">Decks · tap one to learn it next</div><div class="decks">${decks}</div></div>

  </div>`;
}

function vStudy(){
  if(!sess.queue.length){
    return `<div class="done fade"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1"><path d="M12 3l2.6 2.6H18.4V9.4L21 12l-2.6 2.6v3.8h-3.8L12 21l-2.6-2.6H5.6v-3.8L3 12l2.6-2.6V5.6h3.8z"/></svg>
      <h1>Session complete</h1><p class="muted" style="margin:0">${sess.seen} word${sess.seen===1?'':'s'} reviewed${sess.newSeen?`, ${sess.newSeen} of them new`:''}.<br>Bārak Allāhu fīk.</p>
      <button class="btn gold" data-act="exit" style="min-width:200px">Back to Today</button></div>`;
  }
  const w=BYID[sess.queue[0]], d=DECK[w.d], isNew=!S.cards[w.id], done=sess.total-sess.queue.length;
  const now=Date.now();
  const rates=[['Again','var(--rose)'],['Hard','var(--sand)'],['Good','var(--sage)'],['Easy','var(--sky)']].map((r,i)=>
    `<button style="--c:${r[1]}" data-act="rate" data-r="${i}"><b>${r[0]}</b><small>${fmtIvl(sched(S.cards[w.id],i,now).ivl)}</small></button>`).join('');
  return `<div class="stack" style="gap:18px">
   <div class="top"><button class="iconbtn" data-act="exit" aria-label="End session"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
     <div class="prog"><i style="width:${sess.total?done/sess.total*100:0}%"></i></div><span class="n">${done} / ${sess.total}</span></div>
   <div class="flash fade" ${sess.rev?'':'data-act="reveal" role="button" tabindex="0" aria-label="Reveal meaning"'}>
     <span class="pill" style="--c:${d.c}">${d.name}${isNew?' · new':''}</span>${spk(w.ar)}
     <div class="ar word">${w.ar}</div>
     ${sess.rev?`<div class="tr">${w.tr}</div><div class="en">${w.en}</div><div class="type">${w.t}</div>${exHTML(w)}`:`<p class="hint">Tap the card to reveal the meaning</p>`}
   </div>
   ${sess.rev?`<div class="rate">${rates}</div>`:`<button class="btn ghost full" data-act="reveal">Show meaning</button>`}
  </div>`;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuiz(mode,deck){
  let pool=WORDS.filter(w=>deck==='all'||w.d===deck);
  const qs=shuffle(pool.slice()).slice(0,10).map(w=>{
    const others=shuffle((pool.length>=6?pool:WORDS).filter(o=>o.id!==w.id&&o.en!==w.en)).slice(0,3);
    return {w,opts:shuffle([w,...others])};
  });
  return {mode,deck,qs,i:0,pick:null,score:0,started:true};
}
function vQuiz(){
  if(!quiz||!quiz.started){
    const q=quiz||{mode:'ar',deck:'all'};
    const chips=[{id:'all',name:'All words',c:'var(--gold)'},...DECKS].map(d=>`<button class="chip ${q.deck===d.id?'on':''}" style="--c:${d.c}" data-act="qdeck" data-d="${d.id}"><span class="dot" style="--c:${d.c}"></span>${d.name}</button>`).join('');
    return `<div class="stack fade">
      <div><div class="eyebrow">Quiz</div><h1 style="margin-top:6px">Ten quick questions.</h1><p class="muted" style="margin:8px 0 0">Choose the right meaning. Quiz answers don’t change your review schedule.</p></div>
      <div class="stack" style="gap:10px"><div class="eyebrow">Direction</div><div class="seg"><button class="${q.mode==='ar'?'on':''}" data-act="qmode" data-m="ar">Arabic → English</button><button class="${q.mode==='en'?'on':''}" data-act="qmode" data-m="en">English → Arabic</button></div></div>
      <div class="stack" style="gap:10px"><div class="eyebrow">Words from</div><div class="chips">${chips}</div></div>
      <button class="btn gold full" data-act="qstart">Start quiz</button></div>`;
  }
  if(quiz.i>=quiz.qs.length){
    const n=quiz.qs.length,s=quiz.score;
    const msg=s===n?'Every one right. Māshāʾ Allāh.':s>=n*.7?'Strong result. Keep going.':'A good start. The daily session will help these stick.';
    return `<div class="done fade"><div class="eyebrow">Your score</div><div class="score">${s}<span style="font-size:1.6rem;color:var(--muted)"> / ${n}</span></div><p class="muted" style="margin:0">${msg}</p>
      <div style="display:flex;gap:10px"><button class="btn gold" data-act="qagain">Try another</button><button class="btn ghost" data-act="qsetup">Change settings</button></div></div>`;
  }
  const {w,opts}=quiz.qs[quiz.i], ar=quiz.mode==='ar';
  const o=opts.map(x=>{let cls='';if(quiz.pick){if(x.id===w.id)cls='ok';else if(x.id===quiz.pick)cls='no'}
    return `<button class="opt ${ar?'':'aropt ar'} ${cls}" data-act="qpick" data-id="${x.id}" ${quiz.pick?'disabled':''}>${ar?`<span>${x.en}</span>`:x.ar}</button>`}).join('');
  return `<div class="stack" style="gap:18px">
    <div class="top"><button class="iconbtn" data-act="qsetup" aria-label="End quiz"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="prog"><i style="width:${quiz.i/quiz.qs.length*100}%"></i></div><span class="n">${quiz.i+1} / ${quiz.qs.length}</span></div>
    <div class="q fade">${ar?`<div class="ar">${w.ar}</div>`:`<div class="enq">${w.en}</div>`}${quiz.pick?`<div class="tr">${w.tr}${ar?'':' · '+w.ar}</div>`:''}</div>
    <div class="opts">${o}</div>
    ${quiz.pick?`${w.ex?`<div class="ex" style="text-align:center;margin:0">${exHTML(w).replace('<div class="ex">','').replace(/<\/div>$/,'')}</div>`:''}<button class="btn gold full" data-act="qnext">${quiz.i+1<quiz.qs.length?'Next':'See score'}</button>`:''}
  </div>`;
}

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[ً-ٰٟۖ-ۭـʿʾ’-]/g,'').replace(/[أإآٱ]/g,'ا');
function vWords(){
  const q=norm(W.q.trim());
  const list=WORDS.filter(w=>(W.deck==='all'||w.d===W.deck)&&(!q||norm(w.en+' '+w.tr+' '+w.ar).includes(q)));
  const chips=[{id:'all',name:'All',c:'var(--gold)'},...DECKS].map(d=>`<button class="chip ${W.deck===d.id?'on':''}" style="--c:${d.c}" data-act="wdeck" data-d="${d.id}">${d.id==='all'?'':`<span class="dot" style="--c:${d.c}"></span>`}${d.name}</button>`).join('');
  const rows=list.map(w=>{const st=status(w.id),open=W.open===w.id;
    return `<button class="row" data-act="wopen" data-id="${w.id}" aria-expanded="${open}"><span class="st" style="--s:${STC[st]}" title="${st}"></span><span class="m">${w.en}<small>${w.tr}</small></span><span class="ar">${w.ar}</span>
      ${open?`<span class="detail"><span class="type">${DECK[w.d].name} · ${w.t} · ${st}</span>${w.ex?`<span class="ar">${w.ex[0]}</span><span class="muted" style="font-size:.88rem">${w.ex[1]}</span><span class="ref">Qur’an ${w.ex[2]}</span>`:''}${canSpeak?`<span class="link" data-act="speak" data-t="${w.ar}" style="font-size:.85rem">Hear it</span>`:''}</span>`:''}</button>`}).join('');
  return `<div class="stack fade" style="gap:18px">
    <div><div class="eyebrow">Word list</div><h1 style="margin-top:6px">${WORDS.length} words</h1></div>
    <input class="search" id="wq" type="search" placeholder="Search English, transliteration or Arabic" value="${W.q.replace(/"/g,'&quot;')}" autocomplete="off">
    <div class="chips">${chips}</div>
    <div class="legend">${Object.entries(STC).map(([k,c])=>`<span><i style="--s:${c}"></i>${k[0].toUpperCase()+k.slice(1)}</span>`).join('')}</div>
    <div class="list">${rows||'<p class="muted">No words match that search.</p>'}</div></div>`;
}

function render(){
  document.getElementById('tabs').style.display=(tab==='study')?'none':'';
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $v.innerHTML=tab==='today'?vToday():tab==='study'?vStudy():tab==='quiz'?vQuiz():vWords();
}

/* ---------- Actions ---------- */
function startSession(){
  const due=dueIds(), nw=newIds();
  // interleave new words among reviews
  const q=[];let i=0,j=0;while(i<due.length||j<nw.length){if(i<due.length)q.push(due[i++]);if(i<due.length)q.push(due[i++]);if(j<nw.length)q.push(nw[j++])}
  sess={queue:q,total:q.length,rev:false,seen:0,newSeen:0,counted:new Set()};
  tab='study';render();scrollTo(0,0);
}
function rate(r){
  const id=sess.queue.shift(), now=Date.now(), today=dk(now);
  if(!S.cards[id]){if(S.newDay!==today){S.newDay=today;S.newCount=0}S.newCount++;sess.newSeen++}
  S.cards[id]=sched(S.cards[id],r,now);
  if(!sess.counted.has(id)){sess.counted.add(id);sess.seen++}
  if(!S.days.includes(today))S.days.push(today);
  if(r===0){sess.queue.splice(Math.min(3,sess.queue.length),0,id);sess.total++}
  sess.rev=false;save();render();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-tab]');if(!el)return;
  const a=el.dataset.act;
  if(!a&&el.dataset.tab){tab=el.dataset.tab;askReset=false;if(tab==='quiz'&&quiz&&quiz.i>=quiz.qs?.length)quiz.started=false;render();scrollTo(0,0);return}
  switch(a){
    case 'speak':e.stopPropagation();speak(el.dataset.t);return;
    case 'start':startSession();break;
    case 'reveal':sess.rev=true;render();break;
    case 'rate':rate(+el.dataset.r);break;
    case 'exit':sess=null;tab='today';render();break;
    case 'focus':S.focus=el.dataset.d;save();render();break;
    case 'tab':tab=el.dataset.tab;render();break;
    case 'reset':askReset=true;render();break;
    case 'reset-no':askReset=false;render();break;
    case 'reset-yes':S=fresh();save();askReset=false;render();break;
    case 'qmode':quiz=Object.assign(quiz||{deck:'all'},{mode:el.dataset.m,started:false});render();break;
    case 'qdeck':quiz=Object.assign(quiz||{mode:'ar'},{deck:el.dataset.d,started:false});render();break;
    case 'qstart':case 'qagain':{const q=quiz||{mode:'ar',deck:'all'};quiz=makeQuiz(q.mode,q.deck);render();break}
    case 'qsetup':quiz.started=false;render();break;
    case 'qpick':{if(quiz.pick)break;quiz.pick=el.dataset.id;if(quiz.pick===quiz.qs[quiz.i].w.id)quiz.score++;render();break}
    case 'qnext':quiz.i++;quiz.pick=null;render();break;
    case 'wdeck':W.deck=el.dataset.d;W.open=null;render();break;
    case 'wopen':W.open=W.open===el.dataset.id?null:el.dataset.id;render();break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='wq'){W.q=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById('wq');i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener('keydown',e=>{
  if(tab!=='study'||!sess||!sess.queue.length)return;
  if(!sess.rev&&(e.key===' '||e.key==='Enter')){e.preventDefault();sess.rev=true;render()}
  else if(sess.rev&&['1','2','3','4'].includes(e.key))rate(+e.key-1);
});
if(canSpeak){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
