<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyQuranApp">
<meta name="theme-color" content="#0B0B0C">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="manifest" href="manifest.webmanifest">
<title>MyQuranApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"MQ IndoPak";src:url("fonts/indopak.woff2") format("woff2");font-display:swap}
@font-face{font-family:"MQ Hafs";src:url("fonts/hafs.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Kalimah Quran";src:url("fonts/amiri-quran.woff2") format("woff2");font-display:swap}
@font-face{font-family:"MQ Nastaliq";src:url("fonts/nastaliq.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Kalimah Naskh";src:url("fonts/amiri.woff2") format("woff2");font-display:swap}
:root{
  /* One calm column. Black page, gold for what you act on, pastels only as quiet labels. */
  --bg:#0B0B0C; --surface:#131315; --raise:#1B1B1E; --line:#26262A;
  --text:#ECE7DC; --muted:#8E897F; --faint:#5C5952;
  --gold:#C8A862; --gold-dim:rgba(200,168,98,.13);
  --sand:#E3D2A6; --sky:#A9C5D6; --lav:#BCB4D9; --sage:#AAC4A5; --rose:#E1B4AD;
  --f-q:"Kalimah Quran","Geeza Pro",serif;
  --f-ar:"Kalimah Naskh","Geeza Pro",serif;
  --f-display:"Cormorant Garamond",Georgia,serif;
  --f-body:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ar-size:30px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:1.5px solid var(--gold);outline-offset:3px;border-radius:10px}
.app{max-width:620px;margin:0 auto;padding:0 18px calc(env(safe-area-inset-bottom) + 40px)}
h1,h2{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0}
h1{font-size:2.1rem;line-height:1.15}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:22px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:0 -18px;padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
.bar.line{border-bottom-color:var(--line)}
.bar .title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.bar .title b{font-family:var(--f-display);font-weight:600;font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .title span{font-size:.75rem;color:var(--muted)}
.ib{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);color:var(--text)}
.ib.on{color:var(--gold);border-color:rgba(200,168,98,.5)}
.ib svg{width:18px;height:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.3rem;color:var(--gold);letter-spacing:.04em;flex:1}
.brand .ar{font-family:var(--f-ar);font-size:1.5rem;margin-left:auto;opacity:.85}

/* home */
.cont{display:flex;align-items:center;gap:14px;border:1px solid rgba(200,168,98,.4);background:linear-gradient(180deg,rgba(200,168,98,.08),rgba(200,168,98,0) 80%);border-radius:18px;padding:16px 18px}
.cont .t{flex:1}
.cont b{display:block;font-weight:600}
.cont .go{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#16130B;display:grid;place-items:center;flex:none}
.picks{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px;scrollbar-width:none}
.picks::-webkit-scrollbar{display:none}
.pick{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:0;min-width:118px}
.pick b{font-weight:600;font-size:.92rem}
.pick span{font-size:.75rem;color:var(--muted)}
.pick .ar{font-family:var(--f-ar);font-size:1.15rem;color:var(--gold);line-height:1.6;text-align:right}
.search{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 16px;font:inherit}
.search::placeholder{color:var(--faint)}
.list{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.srow .no{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;width:30px;height:30px;line-height:30px;border:1px solid var(--line);border-radius:9px;transform:rotate(45deg)}
.srow .no i{display:block;transform:rotate(-45deg);font-style:normal}
.srow b{font-weight:600}
.srow small{display:block;color:var(--muted);font-size:.8rem}
.srow .ar{font-family:var(--f-ar);font-size:1.35rem;color:var(--text);opacity:.9}
.tag{font-size:.68rem;letter-spacing:.06em;color:var(--c);}

/* reader */
.shead{text-align:center;padding:26px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.shead .ar{font-family:var(--f-q);font-size:2.4rem;color:var(--gold);line-height:1.7}
.shead p{margin:0;font-size:.85rem;color:var(--muted)}
.bism.playing{color:var(--gold);transition:color .3s}
.bism{font-family:var(--f-q);font-size:1.7rem;text-align:center;color:var(--text);margin:14px 0 4px;line-height:2}
.ayah{padding:22px 0 20px;border-bottom:1px solid var(--line);scroll-margin-top:90px}
.ayah.playing{border-bottom-color:rgba(200,168,98,.45)}
.ayah.playing .num{background:var(--gold);color:#16130B;border-color:var(--gold)}
.ah{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.num{min-width:34px;height:26px;padding:0 8px;border-radius:999px;border:1px solid var(--line);font-size:.78rem;color:var(--muted);display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.ah .sp{flex:1}
.mini{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.mini svg{width:14px;height:14px}
.words{direction:rtl;display:flex;flex-wrap:wrap;gap:10px 6px;align-items:flex-start}
.w{display:flex;flex-direction:column;align-items:center;padding:4px 6px 6px;border-radius:12px;max-width:100%;transition:background .15s}
.w:hover{background:var(--surface)}
.w.sel{background:color-mix(in srgb,var(--lav) 14%,transparent)}
.wa{font-family:var(--f-q);font-size:var(--ar-size);line-height:2.15;color:var(--text);white-space:nowrap}
.we{direction:ltr;font-size:.78rem;line-height:1.3;color:var(--muted);text-align:center;max-width:9.5em;margin-top:3px}
.nowbw .we{display:none}
.nowbw .words{gap:4px 4px}
.tx{margin:14px 0 0;color:var(--text);opacity:.88;font-size:1rem;line-height:1.6;max-width:65ch}
.notx .tx,.notx .txu{display:none}
.script-ip .wa{font-size:calc(var(--ar-size)*1.12);line-height:2.25}
.script-ip .sar{line-height:2.5}
.script-ip .bism{font-size:1.9rem;line-height:2.4}
.script-hafs .wa{line-height:2.05}
.styles{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.style{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.style.on{border-color:rgba(200,168,98,.6);background:color-mix(in srgb,var(--gold) 7%,var(--surface))}
.style b{display:block;font-weight:600;font-size:.95rem}
.style small{color:var(--muted);font-size:.76rem}
.style .rplay{color:var(--gold);flex:none;width:18px}
.style .smp{direction:rtl;font-size:1.45rem;line-height:2;white-space:nowrap;color:var(--text)}
.style.on .smp{color:var(--gold)}
.txu{margin:12px 0 0;direction:rtl;text-align:right;font-family:"MQ Nastaliq","Kalimah Naskh",serif;font-size:1.12rem;line-height:2.35;color:var(--text);opacity:.9}
.txh{display:none;margin:14px 0 0;color:var(--text);opacity:.9;font-size:1rem;line-height:1.65;max-width:65ch}
.txh .gl{color:var(--muted)}
.tr-hi .txh{display:block}
.tr-hi .tx,.tr-hi .txu{display:none}
.notx .txh{display:none}
.tr-en .txu{display:none}
.tr-ur .tx{display:none}
.more{display:flex;justify-content:center;padding:24px 0}
.next{display:flex;justify-content:space-between;gap:10px;padding:26px 0}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--raise);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .25s ease;max-width:620px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sw{text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.sw .ar{font-family:var(--f-q);font-size:3rem;line-height:1.7}
.sw .tr{font-style:italic;color:var(--muted)}
.sw .en{font-family:var(--f-display);font-size:1.7rem;color:var(--gold);line-height:1.2;text-wrap:balance}
.sw .ref{font-size:.78rem;color:var(--faint);margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;padding:0 18px;font-weight:600}
.btn.gold{background:var(--gold);color:#16130B}
.btn.ghost{border:1px solid var(--line)}
.btn svg{width:18px;height:18px}
.set{display:flex;flex-direction:column;gap:6px}
.set .r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set .r:last-child{border-bottom:0}
.tog{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--text);transition:transform .2s}
.tog.on{background:var(--gold)}
.tog.on::after{transform:translateX(20px);background:#16130B}
.steps{display:flex;gap:6px}
.steps button{width:42px;height:36px;border-radius:10px;border:1px solid var(--line);font-family:var(--f-ar)}

.vrow{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.vrow .ar{font-family:var(--f-q);font-size:1.9rem;line-height:1.6;grid-row:1/3;grid-column:2;text-align:right}
.vrow b{font-weight:600}
.vrow small{color:var(--muted);font-size:.8rem}
.vrow small a{color:var(--gold)}
.empty{border:1px dashed var(--line);border-radius:18px;padding:26px 20px;text-align:center;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;min-height:330px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.card .ar{font-family:var(--f-q);font-size:3.6rem;line-height:1.7}
.card .en{font-family:var(--f-display);font-size:1.8rem;color:var(--gold);line-height:1.2}
.card .hint{color:var(--faint);font-size:.85rem;margin-top:10px}

.player{position:fixed;left:0;right:0;z-index:9;bottom:calc(env(safe-area-inset-bottom) + 10px);max-width:620px;margin:0 auto;padding:0 10px;display:none}
.player.on{display:block}
.player>div{background:var(--raise)}
.pr{display:flex;align-items:center;gap:6px;border:1px solid rgba(200,168,98,.35);border-bottom:0;border-radius:18px 18px 0 0;padding:10px 10px 8px 14px}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.pinfo b{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo span{font-size:.75rem;color:var(--gold)}
.pc{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none}
.pc svg{width:18px;height:18px}
.pc.big{width:44px;height:44px;background:var(--gold);color:#16130B}
.player .seg{border:1px solid rgba(200,168,98,.35);border-top:1px solid var(--line);border-radius:0 0 18px 18px;padding:6px;display:flex;gap:4px}
.seg{display:flex;gap:4px;background:var(--surface);border-radius:12px;padding:3px;margin-top:8px}
.player .seg{margin-top:0}
.seg button{flex:1;height:34px;border-radius:9px;font-size:.82rem;color:var(--muted);white-space:nowrap;padding:0 2px}
.player .seg button{font-size:.76rem}
.seg button.on{background:var(--bg);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(200,168,98,.4)}
body.hasplayer .app{padding-bottom:calc(env(safe-area-inset-bottom) + 160px)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translate(-50%,20px);background:var(--sage);color:#111;font-size:.88rem;font-weight:500;padding:10px 16px;border-radius:999px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.hasplayer .toast{bottom:calc(env(safe-area-inset-bottom) + 140px)}
.scard{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sc-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sc-row{display:flex;flex-direction:column;gap:6px}
.sc-l{font-size:.85rem;color:var(--muted)}
.scard .seg{margin-top:0;background:var(--bg)}
.seg.lang button{font-size:.9rem}
.sc-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px;text-align:start;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);width:100%}
.sc-sum small{display:block;color:var(--faint);font-size:.7rem}
.sc-sum b{display:block;font-weight:600;font-size:.84rem;color:var(--text)}
.sc-go{grid-column:1/-1;text-align:center;font-size:.8rem;color:var(--gold);border-top:1px solid var(--line);padding-top:8px}
.bar .brand+.ib{margin-inline-start:4px}
[dir=rtl] .flip svg,[dir=rtl] .cont .go svg{transform:scaleX(-1)}
[dir=rtl] .brand .ar{margin-left:0;margin-right:auto}
.bt{text-align:center;margin:0 0 6px;font-size:.85rem}
.txu.bt{text-align:center;font-size:1rem}
/* Urdu interface: Nastaliq for all labels; taller lines so the script never clips */
body.ui-ur{--f-body:"MQ Nastaliq","Kalimah Naskh",serif;--f-display:"MQ Nastaliq","Kalimah Naskh",serif;line-height:1.95}
.ui-ur h1{font-size:1.65rem;line-height:2}
.ui-ur h2{font-size:1.2rem;line-height:2}
.ui-ur .eyebrow{letter-spacing:0;text-transform:none;font-size:.85rem}
.ui-ur .seg button{height:auto;min-height:38px;padding:2px 2px 6px;font-size:.8rem;line-height:1.9}
.ui-ur .mini{height:auto;min-height:34px;padding:0 12px 4px;line-height:1.9}
.ui-ur .btn{height:auto;min-height:48px;padding-bottom:4px;line-height:1.9}
.ui-ur .srow b,.ui-ur .pick b{font-family:"Kalimah Naskh",serif;font-size:1.05rem}
.ui-ur .bar .title b{font-family:"Kalimah Naskh",serif}
.ui-ur .search{height:52px}
.ui-ur .sc-sum small{font-size:.72rem}
.ui-ur .bt[dir=ltr],.ui-ur .tx,.ui-ur .txh,.ui-ur .we,.ui-ur .sw .tr,.ui-ur .sw .en{font-family:"Figtree",-apple-system,sans-serif;line-height:1.55}
.ui-ur .sw .en{font-family:"Cormorant Garamond",Georgia,serif}
.ui-ur .num{line-height:1.6}
.foot{font-size:.75rem;color:var(--faint);padding-top:10px}

/* opening animation: walls rise, dome grows in gold, crescent appears and glows, then the screen fades away */
.splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;place-items:center;transition:opacity .6s ease}
.splash.on{display:grid}
.splash.out{opacity:0;pointer-events:none}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:6px}
.sp-name{font-family:var(--f-display);font-weight:500;font-size:2rem;color:var(--gold);letter-spacing:.04em;opacity:0;animation:spFade .8s 1.5s ease-out forwards}
.sp-ar{font-family:var(--f-ar);font-size:1.3rem;color:var(--muted);opacity:0;animation:spFade .8s 1.75s ease-out forwards}
.aqsa.anim .walls{transform-box:fill-box;transform-origin:50% 100%;animation:spRise .8s .1s cubic-bezier(.2,.8,.2,1) both}
.aqsa.anim .dome{transform-box:fill-box;transform-origin:50% 100%;animation:spGrow 1s .6s cubic-bezier(.2,.8,.2,1) both}
.aqsa.anim .crest{animation:spDrop .7s 1.35s ease-out both,spGlow 2.4s 2s ease-in-out infinite}
@keyframes spRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spGrow{from{opacity:0;transform:scaleY(.05)}to{opacity:1;transform:none}}
@keyframes spDrop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
@keyframes spGlow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 2.5px rgba(230,207,143,.9))}}
@keyframes spFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.brand .aqsa{flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true"><div class="sp-in">__SPLASH__<b class="sp-name">MyQuranApp</b></div></div>
<main class="app" id="view"></main>
<div class="player" id="player" aria-label="Audio player"></div>
<div class="toast" id="toast" role="status"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script>
const INDEX=__INDEX__; // [n, arabic name, name, meaning, type, ayahs]
const MOSQUE='__MOSQUE__';
const ICON={
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 5l-7 7 7 7"/></svg>',
 play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
 pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>',
 aa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 18l5-12 5 12M4.8 14h6.4M14.5 18l3.2-8 3.3 8M15.6 15.5h4.3"/></svg>',
 bm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.5 4h11v16l-5.5-4-5.5 4z"/></svg>',
 bmf:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 4h11v16l-5.5-4-5.5 4z"/></svg>',
 prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6h2v12H7zM19 6v12l-9-6z"/></svg>',
 next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 6h2v12h-2zM5 6v12l9-6z"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 6l12 12M18 6L6 18"/></svg>',

    <button class="sc-sum" data-act="settings">

      <span><small>${t('reciter')}</small><b>${tRec(PREF.reciter).name}</b></span>
      <span><small>${t('translationShown')}</small><b>${TRANS()[PREF.trans]}</b></span>
      <span class="sc-go">${t('change')}</span>
    </button>
  </section>`;
}
function renderHome(){
  const qq=q.toLowerCase().replace(/[-'’ʿ\s]/g,'');
  const list=INDEX.filter(x=>!q||(x[0]+' '+x[2]+' '+x[3]).toLowerCase().replace(/[-'’ʿ\s]/g,'').includes(qq)||x[1].includes(q)||(x[6]||'').includes(q));
  const cont=LAST&&S(LAST.s)?`<a class="cont" href="#surah-${LAST.s}-${LAST.v}"><span class="t"><span class="eyebrow">${t('continue')}</span><b>${sname(LAST.s)} · ${t('ayahN',LAST.v)}</b><span class="muted" style="font-size:.85rem">${smean(LAST.s)}</span></span><span class="go">${ICON.arrow}</span></a>`:'';
  $v.innerHTML=`<div class="bar"><span class="brand">${MOSQUE}MyQuranApp</span><button class="ib" data-act="settings" aria-label="${t('allSettings')}">${ICON.aa}</button></div>
  <div class="stack" style="padding-top:14px">
    <div><h1>${t('homeTitle')}</h1><p class="muted" style="margin:8px 0 0">${t('homeSub')}</p></div>
    ${cont}
    ${settingsCard()}
    <div class="stack" style="gap:10px"><div class="eyebrow">${t('startHere')}</div><div class="picks">${PICKS.map(p=>`<a class="pick" href="#surah-${p[0]}${p[3]?'-'+p[3]:''}"><span class="ar">${p[4]||S(p[0])[1]}</span><b>${isUR()?(p[5]||S(p[0])[1]):p[1]}</b><span>${p[3]?'2 : 255':smean(p[0])}</span></a>`).join('')}</div></div>
    <div class="stack" style="gap:12px"><div class="eyebrow">${t('allSurahs')}</div>
      <input class="search" id="q" type="search" placeholder="${t('search')}" value="${esc(q)}" autocomplete="off">
      <div class="list">${list.map(x=>`<a class="srow" href="#surah-${x[0]}"><span class="no"><i>${x[0]}</i></span><span><b>${sname(x[0])}</b><small>${smean(x[0])} · ${t('ayahs',x[5])} · <span class="tag" style="--c:${x[4]==='meccan'?'var(--sand)':'var(--sky)'}">${t(x[4]==='meccan'?'makkah':'madinah')}</span></small></span><span class="ar">${isUR()?'':x[1]}</span></a>`).join('')||`<p class="muted">${t('noMatch')}</p>`}</div>
    </div>
    <p class="foot">${t('credits')}<br>Version 3.1 · ${isUR()?'اردو':'English'}</p>
  </div>`;
}

/* ---------- reader ---------- */
function ayahHTML(s,d,v){
  const a=d.v[v-1];
  const T=isIP()&&a.i?a.i:a.a;
  const words=T.map((ar,i)=>{
    if(ar==='')return '';   // Indo-Pak writes this word together with the next one
    const mean=i>0&&T[i-1]===''?a.w[i-1]+' '+a.w[i]:a.w[i];
    return `<button class="w" data-act="word" data-v="${v}" data-i="${i}"><span class="wa">${ar}</span><span class="we" dir="ltr">${esc(mean)}</span></button>`}).join('');
  return `<article class="ayah" id="a-${v}" data-v="${v}">
    <div class="ah"><span class="num">${s}:${v}</span><span class="sp"></span><button class="mini" data-act="ayah-play" data-v="${v}">${ICON.play}${t('listen')}</button></div>
    <div class="words" lang="ar">${words}</div>
    <p class="tx" dir="ltr">${esc(a.en)}</p>${a.ur?`<p class="txu" lang="ur">${esc(a.ur)}</p>`:''}${a.h?`<p class="txh" dir="ltr" lang="ur-Latn">${hinglish(a.h)}</p>`:''}</article>`;
}
function ensureRendered(upto){
  if(!cur||upto<=shown)return;const box=document.getElementById('ayahs');if(!box)return;
  let h='';const end=Math.min(cur.d.v.length,upto);for(let v=shown+1;v<=end;v++)h+=ayahHTML(cur.s,cur.d,v);
  box.insertAdjacentHTML('beforeend',h);shown=end;observe();
  const m=document.getElementById('more');if(m)m.style.display=shown<cur.d.v.length?'':'none';
  const nx=document.getElementById('nextnav');if(nx)nx.style.display=shown<cur.d.v.length?'none':'';
  markPlaying();
}
async function renderRead(){
  const s=R.s,meta=S(s);
  $v.innerHTML=`<div class="bar line"><a class="ib flip" href="#" aria-label="${t('allSurahs')}">${ICON.back}</a><span class="title"><b>${sname(s)}</b><span>${smean(s)} · ${t('ayahs',meta[5])}</span></span>
    <button class="ib" id="playall" data-act="playall" aria-label="${t('listen')}">${ICON.play}</button><button class="ib" data-act="settings" aria-label="${t('allSettings')}">${ICON.aa}</button></div>
    <div id="rbody"><p class="muted" style="padding:40px 0;text-align:center">${t('loading')}</p></div>`;
  let d;try{d=await loadSurah(s)}catch(e){document.getElementById('rbody').innerHTML=`<div class="empty" style="margin-top:30px">${t('loadErr')}</div>`;return}
  if(R.view!=='read'||R.s!==s)return;
  cur={s,d};shown=0;
  const prev=s>1?`<a class="btn ghost" href="#surah-${s-1}"><span class="flip">${ICON.back}</span> ${sname(s-1)}</a>`:'<span></span>';
  const next=s<114?`<a class="btn gold" href="#surah-${s+1}">${sname(s+1)} <span class="flip">${ICON.arrow}</span></a>`:'<span></span>';
  const bt=PREF.trans==='hi'?`<p class="muted bt" dir="ltr">${BISM_HI}</p>`:PREF.trans==='ur'?`<p class="txu bt" lang="ur">${BISM_UR}</p>`:PREF.trans==='both'?`<p class="muted bt" dir="ltr">${BISM_EN2}</p><p class="txu bt" lang="ur">${BISM_UR}</p>`:`<p class="muted bt" dir="ltr">${BISM_EN2}</p>`;
  document.getElementById('rbody').innerHTML=`<div class="shead"><span class="ar" lang="ar">${meta[1]}</span><p>${t(meta[4]==='meccan'?'revealedM':'revealedMd')}</p></div>
    ${s!==1&&s!==9?'<p class="bism" id="bism" lang="ar">'+SCRIPTS[PREF.script].bism+'</p>'+bt:''}
    <div id="ayahs"></div><div class="more" id="more"><button class="btn ghost" data-act="more">${t('more')}</button></div>
    <div class="next" id="nextnav" style="display:none">${prev}${next}</div>`;
  ensureRendered(Math.max(30,R.v+10));
  if(R.v>1){const el=document.getElementById('a-'+R.v);if(el)requestAnimationFrame(()=>el.scrollIntoView({block:'start'}))}else scrollTo(0,0);
  if(!R.v||R.v===1){LAST={s,v:1};store.set('last',LAST)}
}
let pendingLast=null;
function flushLast(){if(pendingLast&&R.view==='read'&&cur&&pendingLast.s===cur.s){LAST=pendingLast;store.set('last',LAST)}pendingLast=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushLast()});
addEventListener('pagehide',flushLast);
function observe(){
  if(obs)obs.disconnect();if(!('IntersectionObserver' in window))return;
  let tm=null;
  obs=new IntersectionObserver(es=>{
    for(const e of es){
      if(e.target.id==='more'&&e.isIntersecting){ensureRendered(shown+30);continue}
      if(e.isIntersecting&&e.target.dataset.v&&cur){clearTimeout(tm);pendingLast={s:cur.s,v:+e.target.dataset.v};tm=setTimeout(flushLast,400)}
    }
  },{rootMargin:'-20% 0px -70% 0px'});
  document.querySelectorAll('.ayah').forEach(a=>obs.observe(a));
  const m=document.getElementById('more');if(m){const o2=new IntersectionObserver(es=>{if(es[0].isIntersecting)ensureRendered(shown+30)},{rootMargin:'600px'});o2.observe(m)}
}

/* ---------- sheet ---------- */
const sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim');
let sheetKind=null;
function openSheet(html,kind){sheetKind=kind||null;sheet.innerHTML='<div class="grab"></div>'+html;sheet.classList.add('on');scrim.classList.add('on')}
function closeSheet(){sheetKind=null;sheet.classList.remove('on');scrim.classList.remove('on');document.querySelectorAll('.w.sel').forEach(e=>e.classList.remove('sel'))}
scrim.onclick=closeSheet;
let selW=null;
function wordSheet(s,v,i){
  const a=cur.d.v[v-1],k=s+':'+v+':'+i;
  const T=isIP()&&a.i?a.i:a.a,joined=i>0&&T[i-1]==='';
  selW={k,s,v,i,a:T[i],w:joined?a.w[i-1]+' '+a.w[i]:a.w[i],t:joined?a.t[i-1]+' '+a.t[i]:a.t[i],p:joined?a.p[i-1]:a.p[i]};
  const n=T.slice(0,i+1).filter(Boolean).length;
  openSheet(`<div class="sw"><span class="ar" lang="ar">${selW.a}</span><span class="tr" dir="ltr">${esc(selW.t)}</span><span class="en" dir="ltr">${esc(selW.w)}</span><span class="ref">${sname(s)} ${s}:${v} · ${t('word',n)}</span></div>
    <button class="btn gold" style="width:100%;margin-top:16px" data-act="wplay">${ICON.play}${t('hearIt')}</button>`,'word');
}
function settingsSheet(){
  const keep=sheet.classList.contains('on')&&sheetKind==='settings'?sheet.scrollTop:0;
  openSheet(`<h2 style="margin-bottom:6px">${t('settingsTitle')}</h2><div class="set">
    <div class="r" style="flex-direction:column;align-items:stretch"><span>${t('appLang')}</span><div class="seg lang">${Object.entries(LANGS).map(([k,l])=>`<button class="${PREF.lang===k?'on':''}" data-act="lang" data-m="${k}"${k==='ur'?' lang="ur"':''}>${l}</button>`).join('')}</div></div>
    <div class="r" style="flex-direction:column;align-items:stretch"><span>${t('arabicStyle')}</span><div class="styles">${Object.keys(SCRIPTS).map(k=>{const f=SCRIPTS[k],tf=tScript(k);return `<button class="style ${PREF.script===k?'on':''}" data-act="script" data-m="${k}"><span><b>${tf.name}</b><small>${tf.sub}</small></span><span class="smp" lang="ar" style="font-family:${f.ff.replace(/"/g,"'")}">${k==='ip'?'بِسۡمِ اللّٰهِ':'بِسۡمِ ٱللَّهِ'}</span></button>`}).join('')}</div></div>
    <div class="r" style="flex-direction:column;align-items:stretch"><span>${t('reciter')}</span><div class="styles">${Object.keys(RECITERS).map(k=>{const r=tRec(k);return `<button class="style ${PREF.reciter===k?'on':''}" data-act="reciter" data-m="${k}"><span><b>${r.name}</b><small>${r.note}</small></span><span class="rplay" aria-hidden="true">${PREF.reciter===k?CHECK:''}</span></button>`}).join('')}</div></div>
    <div class="r" style="flex-direction:column;align-items:stretch"><span>${t('listenTo')}</span><div class="seg">${listenButtons()}</div></div>
    <div class="r"><span>${t('contNext')}</span><button class="tog ${PREF.cont?'on':''}" data-act="pref" data-k="cont" aria-label="${t('contNext')}"></button></div>
    <div class="r" style="flex-direction:column;align-items:stretch"><span>${t('translationShown')}</span><div class="seg">${Object.entries(TRANS()).map(([k,l])=>`<button class="${PREF.trans===k?'on':''}" data-act="trans" data-m="${k}"${k==='ur'?' lang="ur"':''}>${l}</button>`).join('')}</div></div>
    <div class="r"><span>${t('fullTx')}</span><button class="tog ${PREF.tx?'on':''}" data-act="pref" data-k="tx" aria-label="${t('fullTx')}"></button></div>
    <div class="r"><span>${t('wbw')}</span><button class="tog ${PREF.wbw?'on':''}" data-act="pref" data-k="wbw" aria-label="${t('wbw')}"></button></div>
    <div class="r"><span>${t('arSize')}</span><span class="steps"><button data-act="size" data-d="-1" aria-label="−">ا−</button><button data-act="size" data-d="1" aria-label="+">ا+</button></span></div>
    <div class="r"><span><span>${t('offline')}</span><br><small class="muted" id="offl">${t('offlineSub')}</small></span><button class="btn ghost" style="height:38px" data-act="offline">${t('saveBtn')}</button></div>
  </div>`,'settings');
  sheet.scrollTop=keep;
}
function listenButtons(){return Object.entries(LISTEN()).map(([k,l])=>`<button class="${PREF.listen===k?'on':''}" data-act="listen" data-m="${k}">${l}</button>`).join('')}


let toastT=null;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2200)}

// redraw the current screen after a setting changes, keeping your place
async function rerender(){if(R.view==='home')renderHome();else if(R.view==='read'&&cur){R.v=LAST&&LAST.s===cur.s?LAST.v:0;await renderRead()}}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  switch(a){
    case 'word':{document.querySelectorAll('.w.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');wordSheet(cur.s,+el.dataset.v,+el.dataset.i);
      const a2=cur.d.v[+el.dataset.v-1];playWord(cur.s,+el.dataset.v,a2.p[+el.dataset.i]);break}
    case 'wplay':playWord(selW.s,selW.v,selW.p);break;
    case 'ayah-play':{const v=+el.dataset.v;if(P&&P.s===cur.s&&P.v===v){togglePause()}else startAyah(cur.s,v,false);break}
    case 'playall':{if(P&&P.s===cur.s&&P.seq){togglePause();break}let v=1;if(LAST&&LAST.s===cur.s)v=LAST.v;startAyah(cur.s,v,true);break}
    case 'p-prev':step(-1);break;
    case 'p-next':step(1);break;
    case 'p-toggle':togglePause();break;
    case 'p-stop':stopAudio();break;
    case 'lang':{const m=el.dataset.m;if(PREF.lang===m)break;PREF.lang=m;
      if(m==='ur'){PREF.trans='ur';if(PREF.listen==='en'||PREF.listen==='both')PREF.listen='arur';PREF.wbw=false}
      else{if(PREF.trans==='ur')PREF.trans='en';PREF.wbw=true}
      store.set('pref',PREF);applyPref();await rerender();if(sheetKind==='settings')settingsSheet();markPlaying();toast(t('toastLang'));break}
    case 'listen':setListen(el.dataset.m);if(R.view==='home')renderHome();break;
    case 'reciter':{PREF.reciter=el.dataset.m;store.set('pref',PREF);
      document.querySelectorAll('[data-act="reciter"]').forEach(b=>{const on=b.dataset.m===PREF.reciter;b.classList.toggle('on',on);b.querySelector('.rplay').innerHTML=on?CHECK:''});
      // a short sample so you can hear the new voice: Bismillah
      if(P){halt();P.pi=0;P.paused=false;playPart()}else{const u=AR(1,1);let k=0;wAudio.onerror=()=>{k++;if(k<u.length){wAudio.src=u[k];wAudio.play().catch(()=>{})}};wAudio.src=u[0];wAudio.play().catch(()=>{})}
      toast(t('toastReciter',tRec(PREF.reciter).name));if(R.view==='home')renderHome();break}
    case 'script':{PREF.script=el.dataset.m;store.set('pref',PREF);applyPref();
      document.querySelectorAll('[data-act="script"]').forEach(b=>b.classList.toggle('on',b.dataset.m===PREF.script));
      await rerender();break}
    case 'trans':PREF.trans=el.dataset.m;store.set('pref',PREF);applyPref();document.querySelectorAll('[data-act="trans"]').forEach(b=>b.classList.toggle('on',b.dataset.m===PREF.trans));if(R.view==='home')renderHome();else if(R.view==='read'&&cur)await rerender();break;
    case 'close':closeSheet();break;
    case 'more':ensureRendered(shown+30);break;
    case 'settings':settingsSheet();break;
    case 'pref':PREF[el.dataset.k]=!PREF[el.dataset.k];store.set('pref',PREF);applyPref();el.classList.toggle('on',PREF[el.dataset.k]);if(R.view==='home')renderHome();break;
    case 'size':PREF.size=Math.max(0,Math.min(SIZES.length-1,PREF.size+(+el.dataset.d)));store.set('pref',PREF);applyPref();break;
    case 'offline':{const o=document.getElementById('offl');el.disabled=true;let n=0;
      for(let s=1;s<=114;s++){try{await fetch('data/'+s+'.json')}catch(_){}n++;if(o)o.textContent=t('offSaving',n)}
      if(o)o.textContent=t('offDone');el.textContent=t('offSaved');break}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;const p=e.target.selectionStart;renderHome();const i=document.getElementById('q');i.focus();try{i.setSelectionRange(p,p)}catch(_){}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
// Opening the app with no link: go straight back to the ayah you were reading last time.
let resumed=false;
if(!location.hash&&store.get('where','home')==='read'&&LAST&&S(LAST.s)){history.replaceState(null,'','#surah-'+LAST.s+'-'+LAST.v);resumed=true}
route().then(()=>{if(resumed&&LAST)setTimeout(()=>toast(t('resumed')+' · '+sname(LAST.s)+' '+LAST.s+':'+LAST.v),400)});
(function(){const sp=document.getElementById('splash');let seen=false;try{seen=sessionStorage.getItem('mq.splash')==='1';sessionStorage.setItem('mq.splash','1')}catch(e){}
  if(seen||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  sp.classList.add('on');const done=()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),650)};
  const tm=setTimeout(done,2700);sp.addEventListener('click',()=>{clearTimeout(tm);done()});})();
/* Updates: check for a new version each time the app is opened, and reload once when one is installed. */
if('serviceWorker' in navigator){
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded){reloaded=true;location.reload()}});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    reg.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
  }).catch(()=>{}));
}
</script>
</body>
